apiVersion: v1
kind: ConfigMap
metadata: { name: mtc-loki-config, namespace: mtc-observability }
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    ingester:
      wal:
        enabled: true
        dir: /var/loki/wal
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
      retention_delete_delay: 2h
    limits_config:
      retention_period: 24h
      allow_structured_metadata: false
      ingestion_rate_mb: 2
      ingestion_burst_size_mb: 4
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mtc-loki, namespace: mtc-observability }
spec:
  serviceName: mtc-loki
  replicas: 1
  selector: { matchLabels: { app: mtc-loki } }
  template:
    metadata:
      labels: { app: mtc-loki }
      annotations:
        checksum/config: __MTC_SOURCE_HASH__
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loki
          image: __LOKI_IMAGE__
          args: [-config.file=/etc/loki/loki.yaml]
          ports: [{ name: http, containerPort: 3100 }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 600m, memory: 768Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 15, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 60, periodSeconds: 10 }
          volumeMounts:
            - { name: config, mountPath: /etc/loki, readOnly: true }
            - { name: data, mountPath: /var/loki }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: mtc-loki-config }
        - name: data
          persistentVolumeClaim: { claimName: mtc-loki }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata: { name: mtc-loki, namespace: mtc-observability, labels: { app: mtc-loki } }
spec:
  selector: { app: mtc-loki }
  ports: [{ name: http, port: 3100, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: loki-internal, namespace: mtc-observability }
spec:
  podSelector: { matchLabels: { app: mtc-loki } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: mtc-observability }
      ports: [{ protocol: TCP, port: 3100 }]
