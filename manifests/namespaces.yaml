apiVersion: v1
kind: Namespace
metadata:
  name: mtc-lab
  labels:
    mtc-managed: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: v1
kind: Namespace
metadata:
  name: mtc-observability
  labels:
    mtc-managed: "true"
    # Node exporter and Fluentd need host network/log access. App namespace stays restricted.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
  labels:
    mtc-managed: "true"
