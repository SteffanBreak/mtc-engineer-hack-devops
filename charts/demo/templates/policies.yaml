apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-gateway-only
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: demo-nginx }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports: [{ protocol: TCP, port: 8080 }]
  egress: []
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-stable
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-nginx
      app.kubernetes.io/version: stable
