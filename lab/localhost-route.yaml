apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: local-preview, namespace: mtc-lab }
spec:
  parentRefs: [{ name: mtc-gateway, sectionName: http }]
  hostnames: [localhost]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: demo-stable, port: 80 }]
